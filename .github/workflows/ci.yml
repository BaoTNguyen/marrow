name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: marrow

      # marrow imports heart directly (reward.py -> heart.env, spine.py ->
      # heart.events), and its tests bootstrap `../../heart/src` by hand, so the
      # sibling has to sit next to it under the workspace root or nothing
      # collects. Same matrix rule as the rest of the stack: a PR into main is
      # judged against heart's main, work on dev against heart's dev.
      - uses: actions/checkout@v7
        with:
          repository: BaoTNguyen/heart
          ref: ${{ github.base_ref == 'main' && 'main' || 'dev' }}
          path: heart

      - uses: astral-sh/setup-uv@v10.2.0   # no floating major tags after v7
        with:
          python-version: '3.12'

      # Only the dev group (heart from ../heart, pytest), not the project's
      # torch/transformers stack: collection, reward shaping and the spine
      # contracts are all stdlib plus heart. Installing a CUDA stack to run a
      # three-second suite would make the gate slow enough to route around.
      - working-directory: marrow
        run: uv run --only-group dev pytest -q
